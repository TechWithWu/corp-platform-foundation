name: Terraform Unit Tests

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

# 本 workflow 只做静态检查，不需要 Azure OIDC。
permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  terraform-unit-tests:
    name: Terraform Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: infraascode
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ⚠️ 改成你们本地 `terraform version` 的准确版本。
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.0"
          terraform_wrapper: false

          # 关键修复：禁用 Actions 的 Provider 插件缓存。
          # 共享缓存曾可能返回与官方锁中 zh checksum 不一致的包。
          cache: false

      - name: Verify dependency lock file
        run: |
          set -euo pipefail
          test -f .terraform.lock.hcl
          git ls-files --error-unmatch .terraform.lock.hcl
          echo "Lock file SHA-256:"
          sha256sum .terraform.lock.hcl

      - name: Terraform Format Check
        run: terraform fmt -check -recursive .

      # 关键修复：
      # 1. readonly：PR runner 不得偷偷改写 Provider 版本或 checksum。
      # 2. verbose：日志会显示 azapi / modtm / alz 实际从哪个来源安装。
      - name: Terraform Init
        run: terraform init -backend=false -lockfile=readonly -no-color

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Run Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          framework: terraform
          directory: infraascode
          output_format: cli,sarif
          output_file_path: console,results.sarif
          quiet: true
        # 先审计，避免历史存量问题把这次锁文件修复淹没。
        continue-on-error: true

      - name: Upload Checkov SARIF
        if: ${{ always() && hashFiles('results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: checkov-terraform

      - name: Checkov Audit Summary
        if: ${{ always() }}
        run: |
          echo "Checkov conclusion: ${{ steps.checkov.outcome }}"
          echo "当前为审计模式；建立基线后，可移除 continue-on-error 来阻断 PR。"